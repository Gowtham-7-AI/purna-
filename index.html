<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A little secret, just for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Nunito:wght@300;400&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #2a1822; --bg2: #4e2c38; --rose: #e0aaa8; --gold: #e0b98a;
    --paper: #faf6f3; --ink: #2f1a25; --muted: #8a7077;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: #fff;
    background: radial-gradient(ellipse at 80% 20%, var(--bg2), var(--bg1) 60%);
    background-attachment: fixed;
    display: flex; flex-direction: column; align-items: center;
    padding: 72px 20px 32px;
    text-align: center;
  }
  .line { width: 40px; height: 2px; background: var(--gold); margin-bottom: 36px; }
  .kicker { font-size: 1.5rem; font-weight: 400; margin-bottom: 18px; }
  h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 400; font-size: clamp(3.4rem, 17vw, 5.5rem); line-height: .95;
  }
  h1 span { display: block; color: var(--rose); }
  .intro {
    max-width: 30em; margin: 32px auto 28px; line-height: 1.9;
    color: #c9b3ba; font-size: 1.1rem; font-weight: 300;
  }
  .date {
    font-family: 'Playfair Display', Georgia, serif; font-style: italic;
    color: var(--gold); font-size: 1.7rem; margin-bottom: 34px;
  }
  .card {
    position: relative; width: 100%; max-width: 480px;
    background: var(--paper); color: var(--ink);
    border-radius: 6px; padding: 36px 20px 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,.35);
    overflow: hidden;
  }
  .heart-corner { position: absolute; width: 30px; height: 30px; fill: none; stroke: var(--rose); stroke-width: 1.4; }
  .tl { top: 24px; left: 28px; } .br { bottom: 22px; right: 28px; }
  .badge {
    width: 84px; height: 84px; margin: 0 auto 22px;
    border: 1px solid var(--rose); border-radius: 50%;
    display: grid; place-items: center;
  }
  .badge svg { width: 26px; fill: none; stroke: #8a3f5a; stroke-width: 1.6; }
  h2 { font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: 3rem; margin-bottom: 14px; }
  .note { color: var(--muted); line-height: 1.7; margin-bottom: 30px; padding: 0 6px; }
  .timer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .unit { border: 1px solid #e8dedb; background: #fffdfc; padding: 18px 4px 14px; }
  .unit b {
    display: block; font-family: 'Montserrat', system-ui, sans-serif;
    font-weight: 700; font-size: 2.2rem; line-height: 1; margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .unit small { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .auto { color: var(--muted); font-size: .95rem; padding-right: 36px; }
  footer { margin-top: 22px; color: #a58f97; font-size: .95rem; letter-spacing: .06em; }
  @media (max-width: 380px) { .unit b { font-size: 1.9rem; } }
</style>
</head>
<body>

<div class="line"></div>
<p class="kicker">A little secret, just for you</p>
<h1>Welcome <span>Purna.</span></h1>
<p class="intro">This little birthday world is waiting behind one small door. Come back on your special day and unlock it.</p>
<p class="date" id="dateText"></p>

<main class="card">
  <svg class="heart-corner tl" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z"/></svg>
  <div class="badge"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z"/></svg></div>
  <h2 id="title">Not yet...</h2>
  <p class="note" id="note"></p>
  <div class="timer" aria-live="off">
    <div class="unit"><b id="d">00</b><small>Days</small></div>
    <div class="unit"><b id="h">00</b><small>Hours</small></div>
    <div class="unit"><b id="m">00</b><small>Minutes</small></div>
    <div class="unit"><b id="s">00</b><small>Seconds</small></div>
  </div>
  <p class="auto" id="auto"></p>
  <svg class="heart-corner br" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.800-8 11-8 11z"/></svg>
</main>

<footer>Made with &hearts; &middot; <span id="foot"></span></footer>

<script>
  // ====== EDIT THESE TWO LINES ======
  var UNLOCK_DATE = new Date(2026, 9, 16, 0, 0, 0); // year, month (0-based: 9 = October), day, hour, min, sec (local time)
  var NEXT_PAGE   = "main.html";                 // the page to open when the timer ends
  // ==================================

  var label = UNLOCK_DATE.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  var monthDay = UNLOCK_DATE.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
  document.getElementById('dateText').textContent = label + ' \u00B7 \u2661';
  document.getElementById('note').textContent = 'This page opens on ' + label + '. Until then, this little secret stays locked.';
  document.getElementById('auto').textContent = 'Unlocks automatically at midnight on ' + monthDay + '.';
  document.getElementById('foot').textContent = label;

  var redirected = false;
  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    var diff = UNLOCK_DATE - new Date();
    if (diff <= 0) {
      if (!redirected) {
        redirected = true;
        document.getElementById('title').textContent = 'Opening...';
        window.location.replace(NEXT_PAGE);
      }
      return;
    }
    var secs = Math.floor(diff / 1000);
    document.getElementById('d').textContent = pad(Math.floor(secs / 86400));
    document.getElementById('h').textContent = pad(Math.floor(secs % 86400 / 3600));
    document.getElementById('m').textContent = pad(Math.floor(secs % 3600 / 60));
    document.getElementById('s').textContent = pad(secs % 60);
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
